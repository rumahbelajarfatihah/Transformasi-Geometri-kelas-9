<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Transformasi — Lab Maya Matematika</title>
<style>
:root{--bg:#0B1220;--pn:#111C2E;--gr:#1E2D45;--cy:#22D3EE;--am:#FBBF24;--ok:#34D399;--er:#F87171;--tx:#E6EDF7;--t2:#9FB0C9}
*{box-sizing:border-box}
html,body{margin:0;background:#050912;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#wrap{container-type:inline-size;width:min(100vw,177.78vh);margin:0 auto}
.lab{position:relative;width:100%;aspect-ratio:16/9;background:var(--bg);display:grid;grid-template-rows:7% 6% 1fr 13%;font-size:1.05cqw;overflow:hidden;font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:1.5em;padding:0 1.5em;border-bottom:1px solid var(--gr)}
header h1{margin:0;font-size:1.5em;white-space:nowrap}
header p{margin:0;color:var(--t2);font-style:italic;flex:1}
.pg{width:18em;height:.9em;background:var(--gr);border-radius:1em;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--ok));transition:width .3s ease-out}
#stp{display:flex;align-items:center;justify-content:center;gap:.6em;padding:0 1em;border-bottom:1px solid var(--gr)}
.sp{display:flex;align-items:center;gap:.5em;color:var(--t2);padding:.2em .8em;border-radius:2em;border:1px solid var(--gr)}
.sp b{display:grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:var(--gr);font-size:.95em}
.sp.d{color:var(--ok);border-color:var(--ok)}.sp.d b{background:var(--ok);color:#06241a}
.sp.a{color:var(--bg);background:var(--cy);border-color:var(--cy);font-weight:700}.sp.a b{background:var(--bg);color:var(--cy)}
main{display:grid;grid-template-columns:22% 50% 28%;min-height:0}
.pn{background:var(--pn);padding:.9em;overflow:auto;min-height:0}
.pn h3{margin:.8em 0 .3em;font-size:1.05em;color:var(--am)}
.pn h3:first-child{margin-top:0}
#cvw{display:flex;flex-direction:column;min-height:0;padding:.5em;position:relative}
#cv{flex:1;min-height:0;width:100%;touch-action:none;background:var(--bg);border-radius:.8em;cursor:grab}
#cv:focus-visible,.b:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,abbr:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.zm{position:absolute;right:1em;top:1em;display:flex;gap:.4em}
.b{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:2.8em;padding:.2em .9em;border-radius:.9em;border:1px solid var(--gr);background:var(--gr);color:var(--tx);font:inherit;cursor:pointer;transition:background .2s ease-out,transform .2s ease-out}
.b:hover{background:#27405f}.b:active{transform:scale(.97)}
.b.p{background:var(--cy);color:#04202a;border-color:var(--cy);font-weight:700}.b.p:hover{background:#67e8f9}
.b.s{background:var(--am);color:#2a1d00;border-color:var(--am);font-weight:700}
.b.on{outline:2px solid var(--cy)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.4em}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
select,input[type=number],textarea{background:var(--bg);color:var(--tx);border:1px solid var(--t2);border-radius:.6em;font:inherit;padding:.3em .5em}
select{width:100%;min-height:2.6em}
.rw{display:grid;grid-template-columns:5.5em 1fr 4.5em;gap:.4em;align-items:center;margin:.35em 0}
.rw input[type=range]{width:100%;accent-color:var(--cy)}
.tb{width:100%;border-collapse:collapse}.tb td,.tb th{border-bottom:1px solid var(--gr);padding:.2em .3em;text-align:left}.tb th{color:var(--t2);font-weight:600}
.fm{background:var(--bg);border-left:3px solid var(--cy);padding:.4em .6em;margin:.3em 0;border-radius:.4em}
.bd{padding:.5em .7em;border-radius:.6em;font-weight:700;margin:.3em 0}.bd.ok{background:#0d3a2c;color:var(--ok)}.bd.er{background:#3f1b1b;color:var(--er)}.bd.am{background:#3d2f06;color:var(--am)}
textarea{width:100%;min-height:5em;resize:vertical}
abbr{text-decoration:underline dotted;cursor:help;color:var(--cy)}
footer{border-top:1px solid var(--gr);display:flex;gap:1em;padding:.5em 1em;align-items:stretch}
#lg{flex:1;overflow:auto;color:var(--t2);min-width:0}#lg div{white-space:nowrap}
#md{position:absolute;inset:0;background:rgba(5,9,18,.88);display:grid;place-items:center;z-index:5}
#md[hidden]{display:none}
.mc{background:var(--pn);border:1px solid var(--cy);border-radius:1em;width:86%;max-height:92%;overflow:auto;padding:1.2em 1.5em;position:relative}
.mc h2{margin:0 0 .5em}.mc ol{padding-left:1.4em;margin:.3em 0}.mc li{margin:.35em 0}
.mc .x{position:sticky;float:right;top:0}
#ts{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);background:var(--am);color:#2a1d00;padding:.4em 1em;border-radius:2em;z-index:6;font-weight:700}
#ts[hidden]{display:none}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:1em}.cs svg{width:100%;aspect-ratio:1;background:var(--bg);border-radius:.6em}
.fb{padding:.5em .7em;border-radius:.6em;margin:.5em 0;background:var(--bg)}
.mc input[type=text]{background:var(--bg);color:var(--tx);border:1px solid var(--t2);border-radius:.6em;font:inherit;padding:.4em .6em;width:16em}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:800px){
#wrap{width:100%}.lab{aspect-ratio:auto;display:block;font-size:15px;overflow:visible}
header,#stp,footer{flex-wrap:wrap;padding:.6em}main{display:block}.pn{overflow:visible}
#cvw{height:100vw}.b{min-height:44px}.sp span{display:none}.mc{width:96%}.cs{grid-template-columns:1fr}.pg{width:100%}}
</style></head><body>
<div id="wrap"><div class="lab">
<header><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 26V4M4 26H27" stroke="#22D3EE" stroke-width="2.5" fill="none"/><path d="M8 22l7-12 7 12z" fill="#FBBF2488" stroke="#FBBF24" stroke-width="2"/></svg>
<h1>RUANG TRANSFORMASI</h1><p>“Geser, Cerminkan, Putar, Perbesar — Temukan Polanya!”</p>
<div style="display:flex;align-items:center;gap:.6em" aria-label="Progres eksperimen"><div class="pg"><i id="pgb"></i></div><b id="pgt">0%</b></div></header>
<nav id="stp" aria-label="Langkah eksperimen"></nav>
<main>
<section class="pn" aria-label="Panel alat">
<h3>1 · Pilih bangun</h3><select id="sh" aria-label="Pilih bangun"></select><div id="pt" hidden class="rw" style="grid-template-columns:auto 1fr auto 1fr"><span>x</span><input type="number" id="px" min="-10" max="10" step="1" aria-label="Koordinat x titik"><span>y</span><input type="number" id="py" min="-10" max="10" step="1" aria-label="Koordinat y titik"></div>
<h3>2 · Pilih transformasi</h3>
<div class="g3" id="md5"></div>
<h3>3 · Atur parameter</h3><div id="par"></div>
<h3>4 · Jalankan</h3>
<button class="b p" id="run" style="width:100%" aria-label="Jalankan simulasi"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2l11 6-11 6z" fill="currentColor"/></svg>JALANKAN</button>
<div class="g2" style="margin-top:.4em"><button class="b" id="chain" title="Hasil menjadi bangun asal untuk transformasi berikutnya">Lanjutkan dari hasil</button><button class="b" id="uji">Uji Kekongruenan</button>
<button class="b" id="cmp">BANDINGKAN</button><button class="b" id="rst">Reset</button>
<button class="b s" id="hots">Panduan HOTS</button><button class="b s" id="chal">Mode Tantangan</button></div>
<h3>Glosarium</h3>
<p style="color:var(--t2);margin:0;line-height:1.6"><abbr tabindex="0" title="Translasi: pergeseran setiap titik sejauh dan searah vektor yang sama.">translasi</abbr> · <abbr tabindex="0" title="Refleksi: pencerminan terhadap sebuah garis; jarak ke cermin sama.">refleksi</abbr> · <abbr tabindex="0" title="Rotasi: perputaran terhadap titik pusat sejauh sudut tertentu.">rotasi</abbr> · <abbr tabindex="0" title="Dilatasi: perbesaran/pengecilan dengan faktor skala k terhadap titik pusat.">dilatasi</abbr> · <abbr tabindex="0" title="Kongruen: dua bangun yang bentuk dan ukurannya sama persis.">kongruen</abbr> · <abbr tabindex="0" title="Transformasi kaku: translasi, refleksi, rotasi — bentuk dan ukuran tidak berubah.">transformasi kaku</abbr></p>
</section>
<section id="cvw" aria-label="Kanvas bidang koordinat">
<div class="zm"><button class="b" id="zi" aria-label="Perbesar tampilan">＋</button><button class="b" id="zo" aria-label="Perkecil tampilan">－</button><button class="b" id="zr" aria-label="Reset tampilan">⟲</button></div>
<svg id="cv" viewBox="0 0 600 600" tabindex="0" role="img" aria-label="Bidang koordinat. Seret titik sudut atau bangun. Panah keyboard mengubah parameter."></svg>
</section>
<section class="pn" aria-label="Panel hasil"><div id="res"></div>
<h3>Kesimpulanmu</h3><textarea id="cc" aria-label="Tulis kesimpulanmu" placeholder="Tulis kesimpulanmu… Apa yang berubah? Apa yang tetap?"></textarea></section>
</main>
<footer><div style="flex:1;min-width:0;display:flex;flex-direction:column"><b style="color:var(--am)">Catatan pengamatan (riwayat transformasi)</b><div id="lg" aria-live="polite"></div></div>
<div style="display:flex;flex-direction:column;gap:.3em;justify-content:center"><button class="b" id="cp">Salin hasil</button><button class="b" id="cl">Hapus riwayat</button></div></footer>
<div id="md" hidden></div><div id="ts" hidden role="status"></div>
</div></div>
<script>
"use strict";
/* ===== Data ===== */
const $=s=>document.querySelector(s), L='ABCDEFGH', cl=o=>JSON.parse(JSON.stringify(o));
const SH={'Titik':[[2,3]],'Segitiga siku-siku':[[1,1],[5,1],[1,4]],'Segitiga sama sisi':[[1,1],[5,1],[3,4.46]],'Persegi':[[1,1],[4,1],[4,4],[1,4]],'Persegi panjang':[[1,1],[6,1],[6,4],[1,4]],'Jajar genjang':[[1,1],[5,1],[7,4],[3,4]],'Trapesium':[[1,1],[7,1],[5,4],[3,4]],'Segi lima':[[1,1],[5,1],[6,4],[3,6],[0,4]],'Layang-layang':[[3,0],[5,3],[3,7],[1,3]]};
const MN={T:'Translasi',M:'Refleksi',R:'Rotasi',K:'Kekongruenan',D:'Dilatasi'};
const MIR={x:'Sumbu-X',y:'Sumbu-Y',yx:'Garis y = x',ymx:'Garis y = −x',xh:'Garis x = h',yk:'Garis y = k'};
const STEPS=['Pilih Bangun','Pilih Transformasi','Atur Parameter','Jalankan Simulasi','Amati Hasil','Simpulkan'];
const P0=()=>({a:3,b:2,mir:'x',h:2,ky:2,ang:90,cw:false,cx:0,cy:0,sk:2,kt:'T'});
const S={shape:'Segitiga siku-siku',base:cl(SH['Segitiga siku-siku']),gh:[],mode:'T',p:P0(),z:25,t:1,done:new Set(),log:[],tbl:false,sc:{},q:0,hh:{},ans:{},fb:'',show:false,anim:false,drag:null};
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ===== Utilitas ===== */
const r2=v=>Math.round(v*100)/100, rr=v=>Math.round(v*1e6)/1e6;
const fmt=v=>{v=r2(v);if(Object.is(v,-0))v=0;return String(v).replace('.',',').replace('-','−')};
const sg=v=>v<0?'− '+fmt(-v):'+ '+fmt(v), cd=q=>`(${fmt(q[0])}, ${fmt(q[1])})`;
const em=()=>S.mode==='K'?S.p.kt:S.mode, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function toast(m){const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,2400)}
function touch(n){S.done.add(n)}
/* ===== Matematika ===== */
function mir(x,y,p){switch(p.mir){case'x':return[x,-y];case'y':return[-x,y];case'yx':return[y,x];case'ymx':return[-y,-x];case'xh':return[2*p.h-x,y];default:return[x,2*p.ky-y]}}
// Titik bayangan; t (0..1) = kemajuan animasi
function f1(q,m,p,t){const x=q[0],y=q[1];
 if(m==='T')return[x+p.a*t,y+p.b*t];
 if(m==='R'){const th=(p.cw?-1:1)*p.ang*Math.PI/180*t,c=Math.cos(th),s=Math.sin(th),dx=x-p.cx,dy=y-p.cy;return[p.cx+dx*c-dy*s,p.cy+dx*s+dy*c]}
 if(m==='D'){const k=1+(p.sk-1)*t;return[p.cx+(x-p.cx)*k,p.cy+(y-p.cy)*k]}
 const r=mir(x,y,p);return[x+(r[0]-x)*t,y+(r[1]-y)*t]}
const img=(B,m,p,t=1)=>B.map(q=>f1(q,m,p,t).map(rr));
// Statistik bangun: sisi, sudut, luas, keliling
function stats(P){const n=P.length;if(n<3)return{sd:[],an:[],ar:0,pr:0};const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
 const sd=P.map((q,i)=>d(q,P[(i+1)%n]));
 const an=P.map((q,i)=>{const a=P[(i+n-1)%n],b=P[(i+1)%n],u=[a[0]-q[0],a[1]-q[1]],v=[b[0]-q[0],b[1]-q[1]],c=(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)||1);return Math.acos(clamp(c,-1,1))*180/Math.PI});
 let A=0;P.forEach((q,i)=>{const w=P[(i+1)%n];A+=q[0]*w[1]-w[0]*q[1]});
 return{sd,an,ar:Math.abs(A)/2,pr:sd.reduce((a,b)=>a+b,0)}}
const eq=(x,y)=>Math.abs(x-y)<1e-4;
// Uji kekongruenan: semua sisi & sudut sama
function checkCongruence(a,b){return a.sd.every((v,i)=>eq(v,b.sd[i]))&&a.an.every((v,i)=>eq(v,b.an[i]))}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function desc(p=S.p,m=em()){
 if(m==='T')return`Translasi (${fmt(p.a)}, ${fmt(p.b)})`;
 if(m==='M')return`Refleksi ${MIR[p.mir].replace('h',fmt(p.h)).replace('k',fmt(p.ky))}`;
 if(m==='R')return`Rotasi ${fmt(p.ang)}° ${p.cw?'searah':'berlawanan'} jarum jam, pusat (${fmt(p.cx)}, ${fmt(p.cy)})`;
 return`Dilatasi k = ${fmt(p.sk)}, pusat (${fmt(p.cx)}, ${fmt(p.cy)})`}
/* ===== Kanvas ===== */
// Menggambar adegan (dipakai kanvas utama dan mini-lab perbandingan)
function scene(B,m,p,z,t,sm,gh){
 const X=x=>300+x*z,Y=y=>300-y*z,n=Math.ceil(300/z),PS=P=>P.map(q=>X(q[0])+','+Y(q[1])).join(' ');
 let s='<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#FBBF24"/></marker></defs>';
 for(let i=-n;i<=n;i++){s+=`<path d="M${X(i)} 0V600M0 ${Y(i)}H600" stroke="${i?'#1E2D45':'#9FB0C9'}" stroke-width="${i?1:2}"/>`;
  if(i&&i%2===0&&!sm)s+=`<text x="${X(i)}" y="${Y(0)+14}" fill="#9FB0C9" font-size="11" text-anchor="middle">${i}</text><text x="${X(0)-5}" y="${Y(i)+4}" fill="#9FB0C9" font-size="11" text-anchor="end">${i}</text>`}
 const I=img(B,m,p,t),F=img(B,m,p,1);
 if(m==='M'){const l={x:[-30,0,30,0],y:[0,-30,0,30],yx:[-30,-30,30,30],ymx:[-30,30,30,-30],xh:[p.h,-30,p.h,30],yk:[-30,p.ky,30,p.ky]}[p.mir];
  s+=`<path d="M${X(l[0])} ${Y(l[1])}L${X(l[2])} ${Y(l[3])}" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="8 6"/>`}
 if(m==='R'||m==='D')s+=`<circle cx="${X(p.cx)}" cy="${Y(p.cy)}" r="7" fill="#FBBF24" stroke="#0B1220" stroke-width="2"/>`+(sm?'':`<text x="${X(p.cx)+9}" y="${Y(p.cy)-9}" fill="#FBBF24" font-size="12">pusat (${fmt(p.cx)}, ${fmt(p.cy)})</text>`);
 if(m==='D')B.forEach((q,i)=>s+=`<path d="M${X(p.cx)} ${Y(p.cy)}L${X(F[i][0])} ${Y(F[i][1])}" stroke="#FBBF2477" stroke-dasharray="4 5"/>`);
 if(m==='R'&&B.length){const r=Math.hypot(B[0][0]-p.cx,B[0][1]-p.cy)*z,mg=Math.abs(p.ang)%360;
  if(r>1&&mg>0)s+=`<path d="M${X(B[0][0])} ${Y(B[0][1])}A${r} ${r} 0 ${mg>180?1:0} ${(p.cw?-1:1)*p.ang>0?0:1} ${X(F[0][0])} ${Y(F[0][1])}" fill="none" stroke="#FBBF24" stroke-width="2.5"/>`}
 (gh||[]).forEach(g=>s+=`<polygon points="${PS(g)}" fill="none" stroke="#9FB0C966" stroke-dasharray="2 5"/>`);
 if(t<1)[.25,.5,.75].forEach(f=>s+=`<polygon points="${PS(img(B,m,p,f*t))}" fill="#22D3EE11" stroke="#22D3EE55"/>`);
 s+=`<polygon points="${PS(B)}" fill="none" stroke="#9FB0C9" stroke-width="2" stroke-dasharray="7 5"/>`;
 s+=`<polygon points="${PS(I)}" fill="#22D3EE2E" stroke="#22D3EE" stroke-width="4" stroke-linejoin="round"/>`;
 if(m==='T'&&B.length&&(p.a||p.b))s+=`<path d="M${X(B[0][0])} ${Y(B[0][1])}L${X(F[0][0])} ${Y(F[0][1])}" stroke="#FBBF24" stroke-width="3" marker-end="url(#ar)"/>`;
 B.forEach((q,i)=>{s+=`<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="${sm?3:6}" fill="#E6EDF7"/>`;
  if(!sm)s+=`<text x="${X(q[0])-8}" y="${Y(q[1])+16}" fill="#E6EDF7" font-size="11" text-anchor="end">${L[i]}${cd(q)}</text>`});
 I.forEach((q,i)=>{s+=`<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="${sm?3:6}" fill="#22D3EE"/>`;
  if(!sm)s+=`<text x="${X(q[0])+8}" y="${Y(q[1])-8}" fill="#22D3EE" font-size="12" font-weight="700">${L[i]}′${cd(q)}</text>`});
 return s}
/* ===== Panel hasil ===== */
function genF(){const p=S.p,m=em();
 if(m==='T')return`(x, y) → (x ${sg(p.a)}, y ${sg(p.b)})`;
 if(m==='M')return'(x, y) → '+{x:'(x, −y)',y:'(−x, y)',yx:'(y, x)',ymx:'(−y, −x)',xh:`(${fmt(2*p.h)} − x, y)`,yk:`(x, ${fmt(2*p.ky)} − y)`}[p.mir];
 if(m==='R'){const th=((p.cw?-p.ang:p.ang)%360+360)%360;
  if(!p.cx&&!p.cy&&[0,90,180,270].includes(th))return'(x, y) → '+{0:'(x, y)',90:'(−y, x)',180:'(−x, −y)',270:'(y, −x)'}[th]+` &nbsp;[θ = ${th}°]`;
  return`x′ = ${fmt(p.cx)} + (x − ${fmt(p.cx)})cos θ − (y − ${fmt(p.cy)})sin θ<br>y′ = ${fmt(p.cy)} + (x − ${fmt(p.cx)})sin θ + (y − ${fmt(p.cy)})cos θ`}
 return(!p.cx&&!p.cy)?`(x, y) → (${fmt(p.sk)}·x, ${fmt(p.sk)}·y)`:`(x, y) → (${fmt(p.cx)} + k(x − ${fmt(p.cx)}), ${fmt(p.cy)} + k(y − ${fmt(p.cy)})), k = ${fmt(p.sk)}`}
function conclusion(c,m,p){
 if(m==='D')return p.sk===1?'k = 1: bangun sama persis (kongruen).':`Dilatasi mengubah <b>ukuran</b> (sisi ×${fmt(Math.abs(p.sk))}) tetapi bentuk tetap sebangun. Luas ×${fmt(p.sk*p.sk)}. Karena ukuran berubah, bangun <b>tidak kongruen</b>.`;
 return`${MN[m]} termasuk <abbr tabindex="0" title="Translasi, refleksi, rotasi: bentuk & ukuran tidak berubah.">transformasi kaku</abbr>. Bentuk dan ukuran tetap, hanya ${m==='T'?'posisinya':m==='M'?'posisi dan arah hadapnya':'posisi dan arahnya'} yang berubah. Bangun <b>${c?'kongruen':'tidak kongruen'}</b> dengan bayangannya.`}
function updatePanels(){
 const m=em(),p=S.p,B=S.base,I=img(B,m,p,1),a=stats(B),b=stats(I),c=checkCongruence(a,b);
 let h='<h3>Koordinat</h3><table class="tb"><tr><th>Titik</th><th>Awal</th><th>Bayangan</th></tr>'+B.map((q,i)=>`<tr><td>${L[i]}</td><td>${cd(q)}</td><td style="color:var(--cy)">${L[i]}′ ${cd(I[i])}</td></tr>`).join('')+'</table>';
 h+=`<h3>Rumus · ${MN[S.mode]}</h3><div class="fm">${genF()}</div>`;
 const A=B[0],A2=I[0];

const HOTS=`<h2>Panduan HOTS: 7 langkah gampang</h2><ol>
<li><b>Baca &amp; tandai</b> — garis bawahi yang diketahui (titik, vektor, garis cermin, sudut, faktor skala) dan yang ditanya.</li>
<li><b>Gambar sketsa</b> — buat bidang koordinat sederhana, plot titik/bangun aslinya. <i>“Tangan menggambar, otak memahami.”</i></li>
<li><b>Kenali kata kunci</b> — “digeser/translasi” → Translasi · “dicerminkan/terhadap sumbu/garis” → Refleksi · “diputar/rotasi” → Rotasi · “diperbesar/diperkecil/faktor skala k” → Dilatasi.</li>
<li><b>Tulis rumusnya</b> — Translasi (a,b): (x+a, y+b) · Refleksi: x→(x,−y), y→(−x,y), y=x→(y,x), y=−x→(−y,−x) · Rotasi 90°: (−y,x), 180°: (−x,−y), 270°: (y,−x) · Dilatasi pusat (0,0): (kx, ky).</li>
<li><b>Hitung pelan-pelan</b> — satu titik satu baris, tulis pasangan asal → bayangan.</li>
<li><b>Cek logika (wajib!)</b> — Apakah bentuk berubah? Ukuran berubah? Tetap semua → kongruen. Ukuran berubah → tidak kongruen (dilatasi).</li>
<li><b>Simpulkan &amp; periksa</b> — tulis jawaban lengkap dengan koordinat/satuan, lalu uji balik dengan memplot hasilnya di lab ini.</li></ol>
<button class="b p" data-go="chal">Coba di Mode Tantangan</button>`;

$('#zi').onclick=()=>{S.z=Math.min(45,S.z+5);render()};$('#zo').onclick=()=>{S.z=Math.max(12,S.z-5);render()};$('#zr').onclick=()=>{S.z=25;render()};
$('#cl').onclick=()=>{S.log=[];render()};
$('#cc').addEventListener('input',e=>{if(e.target.value.trim().length>=8){if(!S.done.has(6)){touch(6);updatePanels()}}});
$('#cp').onclick=()=>{const tx=`RUANG TRANSFORMASI — Hasil Pengamatan\nBangun: ${S.shape}\n${S.log.join('\n')||'(belum ada transformasi)'}\nKesimpulan: ${$('#cc').value||'-'}`;
 try{navigator.clipboard.writeText(tx).then(()=>toast('Hasil disalin'),fb)}catch(_){fb()}
 function fb(){const t=document.createElement('textarea');t.value=tx;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Hasil disalin')}catch(_){toast('Salin manual dari kotak catatan')}t.remove()}};
buildP();render();
</script></body></html>
